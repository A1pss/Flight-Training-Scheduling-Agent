# Alembic 配置。**迁移内容由 M1 窗口交付**；M0 只保证 alembic.ini 与 env.py
# 能跑通（`alembic current` / `alembic revision` 不报错）。
#
# 数据库 URL 不写死在这里——由 env.py 从 backend.core.config.Settings 读取，
# 保证与应用用的是同一份配置（同一个 .env）。

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
timezone = Asia/Shanghai

[post_write_hooks]
# 用 exec 而非 console_scripts：ruff 的 wheel 不注册 console_scripts 入口点，
# alembic 会报 "Could not find entrypoint console_scripts.ruff"。
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
