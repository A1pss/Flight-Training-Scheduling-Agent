# pre-commit —— 本地提交前跑 CLAUDE.md §6 质量门禁的静态部分。
# 完整六条（含 pytest 覆盖率门禁）由 CI 与收工检查单负责。
#
# 安装：conda run -n schedule pre-commit install

default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # mypy / bandit / import-linter 用本地 conda 环境跑，避免 pre-commit
      # 自建虚拟环境导致与 CI 用的不是同一套依赖。
      - id: mypy
        name: mypy --strict backend
        entry: conda run -n schedule mypy backend --strict
        language: system
        pass_filenames: false
        types: [python]

      - id: bandit
        name: bandit -r backend -ll
        entry: conda run -n schedule bandit -r backend -ll
        language: system
        pass_filenames: false
        types: [python]

      - id: import-linter
        name: lint-imports（三条依赖禁令）
        entry: conda run -n schedule lint-imports
        language: system
        pass_filenames: false
        types: [python]

      # 这两条静态扫描 CI 也跑（ci.yml 的「铁律 1」与「E2/E3」两步）。
      # 本地必须一起跑：M2-A 的 CI 连着红过三次，每次都是「本地没跑到这一步」或
      # 「跑在了 CI 看不到的那一侧」。两个脚本的扫描集都是
      # `git ls-files --cached --others --exclude-standard`，所以 pre-commit 里
      # `pass_filenames: false` 不会漏掉暂存的新文件。
      - id: no-placeholders
        name: 禁止 TODO/FIXME/NotImplementedError（铁律 1）
        entry: bash deploy/scripts/check_no_placeholders.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: egress-scan
        name: E2/E3 egress 静态扫描（v6 §12.5.4）
        entry: bash deploy/scripts/check_egress.sh
        language: system
        pass_filenames: false
        always_run: true
