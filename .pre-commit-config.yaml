# pre-commit —— 本地提交前跑 CLAUDE.md §6 质量门禁的静态部分。
# 完整六条（含 pytest 覆盖率门禁）由 CI 与收工检查单负责。
#
# 安装：conda run -n schedule pre-commit install
#      conda run -n schedule pre-commit install-hooks     # 预建远端 hook 环境
#
# ⚠️ **`pre-commit run --all-files` 在本机跑不了**：pre-commit 4.6 会调
#    `git ls-files --deduplicate`，而系统 git 是 2.25.1（该选项 git 2.31 才有）。
#    **提交时的 hook 不受影响** —— 它走 staged 文件那条路径，不碰 `--deduplicate`。
#    要做一次全量扫描，用显式文件清单代替：
#        conda run -n schedule pre-commit run --files $(git ls-files)
#    或者直接跑 CLAUDE.md §6 的那几条命令（CI 跑的就是它们，不经 pre-commit）。
#
# ⚠️ **所有与 CI 重叠的检查一律用本地 conda 环境跑（`language: system`）**，
#    不要换成 pre-commit 自建环境的远端 hook。理由是实测过的：ruff 曾经用
#    `ruff-pre-commit` 的 v0.9.6，而 CI 用的是环境里的 0.16.1，两者对
#    `S603` 的判定不一致 —— pre-commit 删掉一个 `noqa`，CI 又要求加回来，
#    来回打架。**本地与 CI 必须是同一套依赖**，这是本仓库反复踩过的那一类坑
#    （见 `reports/M2A_收工报告.md` §11）。
#    只有「与 CI 无对应项」的通用卫生检查才用远端 hook（下面 pre-commit-hooks 那组）。

default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      # ruff / mypy / bandit / import-linter 全部用本地 conda 环境跑，避免 pre-commit
      # 自建虚拟环境导致与 CI 用的不是同一套依赖（见文件头第二条 ⚠️）。
      - id: ruff
        name: ruff check --fix
        entry: conda run -n schedule ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: conda run -n schedule ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy --strict backend
        entry: conda run -n schedule mypy backend --strict
        language: system
        pass_filenames: false
        types: [python]

      - id: bandit
        name: bandit -r backend -ll
        entry: conda run -n schedule bandit -r backend -ll
        language: system
        pass_filenames: false
        types: [python]

      - id: import-linter
        name: lint-imports（三条依赖禁令）
        entry: conda run -n schedule lint-imports
        language: system
        pass_filenames: false
        types: [python]

      # 这两条静态扫描 CI 也跑（ci.yml 的「铁律 1」与「E2/E3」两步）。
      # 本地必须一起跑：M2-A 的 CI 连着红过三次，每次都是「本地没跑到这一步」或
      # 「跑在了 CI 看不到的那一侧」。两个脚本的扫描集都是
      # `git ls-files --cached --others --exclude-standard`，所以 pre-commit 里
      # `pass_filenames: false` 不会漏掉暂存的新文件。
      - id: no-placeholders
        name: 禁止 TODO/FIXME/NotImplementedError（铁律 1）
        entry: bash deploy/scripts/check_no_placeholders.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: egress-scan
        name: E2/E3 egress 静态扫描（v6 §12.5.4）
        entry: bash deploy/scripts/check_egress.sh
        language: system
        pass_filenames: false
        always_run: true
