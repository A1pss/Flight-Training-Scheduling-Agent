name: CI

# 跑 CLAUDE.md §6 的六条质量门禁。
# **LLM_PROVIDER=mock，不依赖 Ollama、不依赖 GPU、不依赖 Docker。**
# PG/Redis 按 v6 §12.1 以**裸装**方式起（本项目不用 testcontainers）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_PROVIDER: mock
  # 嵌入走确定性哈希实现：`.data/` 已 gitignore，CI 上没有 bge-m3 那 2.2GB 权重。
  # 检索质量指标（v6 §12.4）一律用真模型跑，那是 M5 窗口的事，不在 CI 里。
  EMBED_PROVIDER: hash
  APP_ENV: ci
  PG_HOST: 127.0.0.1
  PG_PORT: "5433"
  PG_USER: fts
  PG_PASSWORD: fts
  PG_DATABASE: fts
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6380"
  # ⚠️ 插桩期的求解墙钟**刻意不在这里设**（业务方 2026-08-14 裁定，`Z-15`）。
  # 它由 `tests/conftest.py` 只给 `@pytest.mark.integration` 的用例设成 300s
  # （M5 从 180s 抬上来，业务方 2026-08-15 裁定，理由见那个文件的注释）：
  # 在这里全局 setenv 会连「产品默认是 60s」那条单测一起改掉
  # （`Settings(_env_file=None)` 仍然读 os.environ），门禁就白设了。
  # 产品默认仍是 60s；理由与参照基准（无插桩 18.8~26.0s）见 v6 §3.11。

jobs:
  gates:
    name: 质量门禁六条
    runs-on: ubuntu-latest
    # 40 → 60（M5）。**这不是放宽判据，是别让作业被掐死后报一个假红。**
    #
    # 实测：M5 全量在开发机上跑 **32m53s**（M4-B 那次 CI 是 34m30s，而 M5 的
    # `test_revision_live.py` 又新增了约 13 次基准级真求解 —— 出口标准要求
    # 五种表述各自重解、undo 连做 3 轮再撤两次、不可行回滚要真跑出 INFEASIBLE）。
    # GitHub 托管跑机普遍比开发机慢，40 分钟大概率不够。
    #
    # 超时被 kill 与「用例失败」在绿勾里长得不一样，但同样浪费一整轮 CI；
    # 而抬这个数**掩盖不了任何失败** —— 失败照样是失败，只是跑得完了。
    timeout-minutes: 60

    steps:
      # fetch-depth: 0 —— 「提示词改了没有」要靠与基线 diff 判定，浅克隆看不到基线
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 PostgreSQL 16 与 Redis 7（裸装，非容器）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 redis-server
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: 起 PG 独立实例（用户态，端口 5433）
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          PGDATA="$GITHUB_WORKSPACE/.data/pg"
          mkdir -p "$PGDATA" "$GITHUB_WORKSPACE/.data/logs"
          initdb -D "$PGDATA" -U "$PG_USER" --auth-local=trust --auth-host=trust -E UTF8
          pg_ctl -D "$PGDATA" -l "$GITHUB_WORKSPACE/.data/logs/pg.log" \
            -o "-p $PG_PORT -k $PGDATA -c listen_addresses=127.0.0.1" start
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p "$PG_PORT" -U "$PG_USER" && break
            sleep 1
          done
          createdb -h 127.0.0.1 -p "$PG_PORT" -U "$PG_USER" "$PG_DATABASE"
          psql -h 127.0.0.1 -p "$PG_PORT" -U "$PG_USER" -d "$PG_DATABASE" -c 'SELECT version();'

      - name: 起 Redis 实例（用户态，端口 6380）
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.data/redis"
          redis-server --port "$REDIS_PORT" --bind 127.0.0.1 --daemonize yes \
            --dir "$GITHUB_WORKSPACE/.data/redis" --save ''
          for i in $(seq 1 30); do
            redis-cli -h 127.0.0.1 -p "$REDIS_PORT" ping && break
            sleep 1
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      # ── 集成测试的前置：建库 ────────────────────────────────────────
      # v6 §12.1 的集成测试**直连裸装 PG**（不用 testcontainers），所以库里必须
      # 先有表。这一步是部署流程（deploy/native + alembic）的如实镜像；
      # 少了它，集成测试会以 `relation "data_snapshots" does not exist` 全线失败。
      - name: 应用数据库迁移（alembic upgrade head）
        run: |
          alembic upgrade head
          alembic current

      # ── CLAUDE.md §6 六条 ──────────────────────────────────────────
      - name: 1/6 ruff check
        run: ruff check .

      - name: 2/6 ruff format --check
        run: ruff format --check .

      - name: 3/6 mypy --strict
        run: mypy backend --strict

      - name: 4/6 bandit
        run: bandit -r backend -ll

      - name: 5/6 lint-imports（三条依赖禁令）
        run: lint-imports

      # ⚠️ `tests/e2e/` 需要 chromium + 真起 uvicorn/streamlit，**CI 上一律跳过**
      # （业务方 2026-08-18 选定，与 `@pytest.mark.ollama` 同一口径）：这里不装
      # 浏览器，`tests/e2e/conftest.py::chromium` 会因 launch 失败而 skip，
      # 并把原因打印出来 —— 不是「绿着但什么都没跑」。
      # 本机跑法：`python -m playwright install chromium && pytest tests/e2e`。
      - name: 6/6 pytest + 覆盖率门禁
        run: pytest -q --cov=backend --cov-report=term-missing --cov-fail-under=80

      # ── 铁律 1 与 v6 §12.5.4 E2/E3 的静态扫描 ──────────────────────
      - name: 铁律 1 —— 无 TODO / NotImplementedError
        run: bash deploy/scripts/check_no_placeholders.sh

      - name: E2/E3 —— egress 静态扫描
        run: bash deploy/scripts/check_egress.sh

      # ── M8：API 文档不许与代码分叉 ─────────────────────────────────
      # `docs/openapi.json` 是交付物之一（v6 §13）。落一份进 Git 的价值在于
      # **端点契约的变化会出现在 diff 里**；而它一旦与代码分叉，那个价值就没了。
      # `--check` 只比对不写文件，分叉即红，逼人跑一次导出。
      - name: OpenAPI 文档与代码一致
        run: python deploy/scripts/export_openapi.py --check

      # ── M8：两条部署路径的确定性配置 ───────────────────────────────
      # 只跑 `--config-only`：CI 上没有 docker，跑不了 compose 那一侧。
      # 但**配置分叉是可以静态查出来的** —— 有人只改了 .env.example 的
      # SOLVER_SEED 而忘了改 compose 的 env 模板，这里就会红。
      # 指纹本身的比对（要真起容器）由 M8 收工实测与交付前的人工验收覆盖。
      - name: native/compose 确定性配置比对
        run: bash deploy/scripts/compare_deploy_paths.sh --config-only

      # ── v6 §7.7.1 第 8 行：提示词版本治理 ──────────────────────────
      # 两步：① 锁文件与正文必须一致（改正文没换版本号 → 红）；
      #       ② `prompts/**` 有改动时跑该组件的 eval 子集。
      # 第 ② 步的判据是 git diff，不是「有没有人记得跑」。
      - name: 提示词锁文件核对
        run: bash deploy/scripts/check_prompt_versions.sh

      - name: 检测提示词改动
        id: prompt_changes
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          # 拿不到基线（push 事件、浅克隆…）一律**当成改过**：多跑一次 eval 子集
          # 只是慢几秒，漏跑一次则是「提示词改了没验」，代价完全不对等。
          CHANGED=true
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            if git diff --name-only "$BASE" HEAD -- prompts/ | grep -q .; then
              git diff --name-only "$BASE" HEAD -- prompts/
            else
              CHANGED=false
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: 提示词 eval 子集（仅在 prompts/ 改动时）
        if: steps.prompt_changes.outputs.changed == 'true'
        run: pytest -m prompt_eval -q

      - name: 收尾停服
        if: always()
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          pg_ctl -D "$GITHUB_WORKSPACE/.data/pg" stop || true
          redis-cli -h 127.0.0.1 -p "$REDIS_PORT" shutdown nosave || true
