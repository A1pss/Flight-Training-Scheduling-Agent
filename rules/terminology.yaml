# 术语对齐表（v6 §6.5.2 查询改写第三步：口语 → 系统术语）
#
# 业务方 2026-08-14 确认采纳（M5 窗口开工前提问）：课目 8 组 + 跑道 2 组 + 空域 6 组，
# **去掉「主跑道」** —— 那是原始资料里没有的说法，业务方明确剔除。
#
# ── 三条口径，改这份文件之前先读 ──────────────────────────────────
#
# ① **本表只做「表述 → 候选集」的映射，不做任何排班判断。**
#    「仪表」映射到 C 类之后，具体落到 missionC-1 还是 C-2、该不该排，
#    仍由 S-01 的类展开、资质过滤、先修判定决定。本表不参与其中任何一步。
#
# ② **target 只在当前快照里存在时才生效。** 一条别名指向的 mission_class /
#    runway_id / airspace_id 若在本次上传的数据里根本没有，该条**静默失效**
#    （不是错误）—— 这样换一批数据（别的机型、别的空域编号）不会让系统报错，
#    也不会把基准数据的编号偷偷带进新快照（CLAUDE.md `Z-4`）。
#
# ③ **一个别名命中两个以上 target 就是歧义，反问，不自行选一个。**
#    与「何超 / 高超」同一条规矩（v6 §6.5.3）。
#
# 别名匹配大小写不敏感，且忽略空格；匹配是**子串**匹配（用户不会只打「仪表」
# 两个字就发过来，通常是「仪表课目到期没」这样一整句）。

version: "1.0"

# ── 课目类：口语 → 课目类别 ────────────────────────────────────────
# target 是**类别字母**而不是具体课目编号：类别到课目的展开唯一实现在
# `retrieval/prereq_cte.py::expand_class_ref`（S-01），本表不重复一份。
missions:
  - mission_class: A
    aliases: [本场起落航线, 起落航线, 起落, 本场]
  - mission_class: B
    aliases: [导航飞行, 导航]
  - mission_class: C
    aliases: [仪表飞行, 仪表课目, 仪表等级, 仪表]
  - mission_class: D
    aliases: [轰炸与射击, 轰炸, 射击, 打靶]
  - mission_class: E
    aliases: [空战机动, 空战, 机动]
  - mission_class: F
    aliases: [编队飞行, 编队]
  - mission_class: G
    aliases: [特技飞行, 特技]
  - mission_class: H
    aliases: [低空突防, 低空, 突防]

# ── 跑道类：口语 → 跑道编号 ────────────────────────────────────────
# 业务方剔除了「主跑道 / 副跑道」——原始资料里没有主副之分，
# 两条跑道的区别是**服务机型**（S-05），不是主次。
runways:
  - runway_id: RWY-1
    aliases: [1号跑道, 一号跑道, 跑道1, 跑道一]
  - runway_id: RWY-2
    aliases: [2号跑道, 二号跑道, 跑道2, 跑道二]

# ── 空域类：口语 → 空域编号 ────────────────────────────────────────
# 空域编号**不是枚举**（`Z-4`）：下面这几条是基准数据里的编号，换一批数据
# 时按口径 ② 静默失效。中文别名是英文名的口语译法，原始资料里只有英文名。
airspaces:
  - airspace_id: SAA
    aliases: [Small Area A, 小区域A, 小区域 A, A区]
  - airspace_id: SAB
    aliases: [Small Area B, 小区域B, 小区域 B, B区]
  - airspace_id: IFR
    aliases: [IFR Route, 仪表航路, 仪表路线]
  - airspace_id: RT1
    aliases: [Route 1, 航路1, 航路一]
  - airspace_id: RT2
    aliases: [Route 2, 航路2, 航路二]
  - airspace_id: RNG
    aliases: [Range Area, 靶场, 靶场区域]
